plugins {
	id 'java'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

// Einzige Quelle der Versionsnummer (siehe RELEASE.md). Der Release-Tag muss "v" + version sein.
version = '1.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation 'net.jqwik:jqwik:1.10.2'
}

jar {
	manifest {
		attributes(
				'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain',
				'Implementation-Title': project.name,
				'Implementation-Version': project.version
		)
	}
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = "0.8.15"
}

pitest {
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	threads = 2
	outputFormats = ['XML', 'HTML']
	timestampedReports = false
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification
