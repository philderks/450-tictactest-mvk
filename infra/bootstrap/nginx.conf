worker_processes 1;
pid /run/tictactest-web/nginx.pid;
error_log stderr;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # systemd stdout is a journal socket, not a reopenable /dev/stdout file.
    access_log /run/tictactest-web/access.log;
    client_body_temp_path /run/tictactest-web/client_body;
    proxy_temp_path /run/tictactest-web/proxy;
    fastcgi_temp_path /run/tictactest-web/fastcgi;
    uwsgi_temp_path /run/tictactest-web/uwsgi;
    scgi_temp_path /run/tictactest-web/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Public HTTP frontend; the console itself remains on loopback.
        listen 0.0.0.0:80;
        listen 127.0.0.1:8080;
        server_name localhost;
        root /opt/tictactest/current/frontend;
        index index.html;

        location = /backend-version.txt {
            alias /var/lib/tictactest/version.txt;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
        }

        location = /console {
            return 301 /console/;
        }

        location /console/ {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
