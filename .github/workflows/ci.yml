name: CI

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test and coverage report
        run: ./gradlew test jacocoTestReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test

      - name: Verify coverage (min. 90%)
        run: ./gradlew jacocoTestCoverageVerification

      - name: Build
        run: ./gradlew build

  publish-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-report
          path: coverage-report

      - name: Check for published site
        id: site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout published site
        if: steps.site.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Assemble site with updated history
        run: |
          mkdir -p site/data
          if [ -f gh-pages/data/coverage.csv ]; then
            cp gh-pages/data/coverage.csv site/data/coverage.csv
          else
            echo "Datum,Commit,Coverage" > site/data/coverage.csv
          fi

          coverage=$(bash .github/scripts/coverage-percent.sh coverage-report)
          echo "$(date -u +%Y-%m-%d),${GITHUB_SHA:0:7},$coverage" >> site/data/coverage.csv

          cp .github/pages/index.html site/index.html
          cp -r coverage-report/html site/coverage

          echo "Coverage auf main: **$coverage %**" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
