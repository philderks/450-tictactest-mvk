name: CI

on:
  # nur Branches - Release-Tags (v*) laufen über release.yml
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # Image-Tag wird vom Workflow "DevContainer" per Auto-PR aktualisiert
    # (bis zum ersten Release: latest). JDK und Gradle kommen aus dem Image, deshalb kein
    # setup-java. `--user root`, weil der Runner das Workspace-Verzeichnis mit
    # seiner eigenen UID anlegt.
    container:
      image: ghcr.io/philderks/tictactest-devcontainer:sha-aa41b820649c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test and coverage report
        run: ./gradlew test jacocoTestReport

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: |
            build/reports/tests/test
            build/test-results/test

      - name: End-to-end tests
        run: ./gradlew e2eTest

      - name: Upload end-to-end test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e-report
          path: |
            build/reports/tests/e2eTest
            build/test-results/e2eTest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test

      - name: Verify coverage (min. 90%)
        run: ./gradlew jacocoTestCoverageVerification

      - name: Mutation testing
        run: ./gradlew pitest

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-mutation-report
          path: build/reports/pitest

      - name: Build
        run: ./gradlew build

  publish-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-coverage-report
          path: coverage-report

      - name: Check for published site
        id: site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout published site
        if: steps.site.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Assemble site with updated history
        run: |
          mkdir -p site/data
          # Alte Instruction-Historie bleibt als Datenarchiv erhalten; nicht mit Branch-Werten mischen.
          if [ -f gh-pages/data/coverage.csv ]; then
            cp gh-pages/data/coverage.csv site/data/coverage.csv
          fi
          if [ -f gh-pages/data/branch-coverage.csv ]; then
            cp gh-pages/data/branch-coverage.csv site/data/branch-coverage.csv
          else
            echo "Datum,Commit,Coverage" > site/data/branch-coverage.csv
          fi

          coverage=$(bash .github/scripts/coverage-percent.sh coverage-report BRANCH)
          echo "$(date -u +%Y-%m-%d),${GITHUB_SHA:0:7},$coverage" >> site/data/branch-coverage.csv

          # Startseite ist der JaCoCo-Report, mit dem Branch-Verlaufsdiagramm über der Tabelle
          cp -r coverage-report/html/. site/
          python .github/scripts/coverage-chart.py site/data/branch-coverage.csv site/coverage-chart.png
          sed -i 's|</div><h1>|</div><h2>Branch-Coverage-Verlauf</h2><img src="coverage-chart.png" alt="Branch-Coverage-Verlauf" style="max-width: 100%"><hr><h1>|' site/index.html
          grep -q coverage-chart.png site/index.html

          echo "Branch Coverage auf main: **$coverage %**" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
