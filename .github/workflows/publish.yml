name: Build and Publish

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build -t ghcr.io/${{ github.repository_owner }}/tictactest-devcontainer:latest -f .devcontainer/Dockerfile .devcontainer

      - name: Push
        run: docker push ghcr.io/${{ github.repository_owner }}/tictactest-devcontainer:latest
