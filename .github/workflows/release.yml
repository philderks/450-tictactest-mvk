name: Release

# Nur ein Release-Tag startet einen Release, ein normaler Push auf main nicht.
# workflow_dispatch: manuell über "Run workflow" - dort unter "Use workflow from" den Tag wählen.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Node for frontend tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check release conditions
        id: version
        run: |
          version=$(./gradlew properties -q | awk '/^version:/ { print $2 }')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu version = '$version' in build.gradle"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA ist nicht auf main"
            exit 1
          fi
          awk -v v="[$version]" '/^## / { p = index($0, v) > 0; next } p' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md enthält keinen Abschnitt für [$version]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: ./gradlew test

      - name: Test web assets and runtime tools
        run: |
          python3 -B -m unittest discover -s scripts/tests -v
          node --test scripts/tests/frontend.test.cjs
          bash -n scripts/start-console.sh

      - name: Build JAR (incl. coverage check)
        run: ./gradlew build

      - name: Smoke test JAR
        env:
          JAR: build/libs/tictactest-${{ steps.version.outputs.version }}.jar
        run: |
          # ganzes Spiel per Pipe: X gewinnt gegen den GreedyPlayer auf der Diagonale 2-4-6
          printf '4\n8\n2\n6\n' | java -jar "$JAR" | tee smoke.log
          grep -q 'winner is: CROSS' smoke.log

      - name: Package frontend and runtime tools
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/package-web-release.py "$VERSION" build/web

      - name: Create JAR SHA-256 checksum
        working-directory: build/libs
        run: sha256sum "tictactest-${{ steps.version.outputs.version }}.jar" > "tictactest-${{ steps.version.outputs.version }}.jar.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "**Tag:** \`$GITHUB_REF_NAME\`"
            echo "**Commit:** $GITHUB_SHA"
            echo "**Artefakt:** \`tictactest-$VERSION.jar\` (Prüfsumme in \`tictactest-$VERSION.jar.sha256\`)"
            echo "**Frontend:** \`tictactest-frontend-$VERSION.zip\` (mit SHA-256-Prüfsumme)"
            echo "**Startwerkzeuge:** \`tictactest-runtime-$VERSION.zip\` (mit SHA-256-Prüfsumme)"
            echo
            echo "## Änderungen"
            cat changes.md
            echo
            echo "## Starten"
            echo
            echo "Benötigt Java 25:"
            echo
            echo '```bash'
            echo "java -jar tictactest-$VERSION.jar"
            echo '```'
            echo
            echo "## Im Browser starten"
            echo
            echo 'Frontend- und Runtime-Archiv herunterladen und die zugehörigen Prüfsummen prüfen.'
            echo 'Beide Archive in eigene Ordner entpacken; runtime/README.md enthält alle lokalen Startbefehle.'
            echo 'Zusätzlich benötigt: Java 25, Python 3, Bash und ttyd (getestet mit 1.7.7). Kein Git-Checkout und kein Frontend-Build erforderlich.'
          } > notes.md

          gh release create "$GITHUB_REF_NAME" \
            "build/libs/tictactest-$VERSION.jar" \
            "build/libs/tictactest-$VERSION.jar.sha256" \
            "build/web/tictactest-frontend-$VERSION.zip" \
            "build/web/tictactest-frontend-$VERSION.zip.sha256" \
            "build/web/tictactest-runtime-$VERSION.zip" \
            "build/web/tictactest-runtime-$VERSION.zip.sha256" \
            --title "TicTacTest $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

          cat notes.md >> "$GITHUB_STEP_SUMMARY"
